name: Evals with Claude

# Run by hand: GitHub -> Actions -> "Evals with Claude" -> Run workflow.
# Needs the repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model ID"
        default: "claude-sonnet-5-5"
        required: true

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/New_York
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the key is set
        run: test -n "$ANTHROPIC_API_KEY" || (echo "Add the ANTHROPIC_API_KEY repository secret first" && exit 1)
      - name: Main set (30 questions)
        run: python -m evals.run_evals --label claude
      - name: Held-out set (10 questions)
        run: python -m evals.run_evals --label claude-holdout --questions questions_holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/claude*.json
